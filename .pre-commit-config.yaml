# Pre-commit hooks for the local-harness.
#
# Install (one-time): pip install pre-commit && pre-commit install
# Run on demand:      pre-commit run --all-files
#
# The harness's deterministic quality gate (`quality_gate.py`) is invoked here
# so any edit that breaks pytest or ruff is blocked at commit time. The deep
# a3 gate stays out of pre-commit by default — it's too slow for every commit
# and is meant for scheduled CI.
#
# `language: python` makes pre-commit manage an ISOLATED Python venv for this
# hook (created on first run, cached thereafter). It installs the exact
# dependencies below, independent of whatever `python3` happens to be on the
# host's PATH. This avoids the trap where the host's default python is
# missing pytest (e.g. the `pi-harness` virtualenv at
# ~/.virtualenvs/pi-harness/), so the test gate fails spuriously.

repos:
  - repo: local
    hooks:
      - id: quality-gate
        name: Deterministic quality gate (pytest + ruff + advisory mypy/bandit)
        entry: python quality_gate.py
        language: python
        # Pre-commit installs these into its isolated env on first run.
        # Versions match [project.optional-dependencies] dev in pyproject.toml.
        # Keep them in sync if you bump the dev extras. ``requests`` is a
        # runtime dep of core/ (LLM API calls) and is required to import
        # any module the tests touch.
        additional_dependencies:
          - pytest>=9.0
          - ruff>=0.16
          - mypy>=2.3
          - bandit>=1.9
          - requests>=2.31
        pass_filenames: false
        types: [python]
        stages: [pre-commit]